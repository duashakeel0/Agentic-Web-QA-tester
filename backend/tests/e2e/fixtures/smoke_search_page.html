<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fixture Smoke Search</title>
</head>
<body>
  <input id="search" type="text" placeholder="Search products" />
  <button id="search-btn" type="button">Search</button>
  <div id="result"></div>

  <script>
    var KNOWN_PRODUCTS = ["pliers", "hammer", "wrench"];
    document.getElementById("search-btn").addEventListener("click", function () {
      var query = document.getElementById("search").value.trim().toLowerCase();
      if (KNOWN_PRODUCTS.indexOf(query) === -1) {
        document.getElementById("result").textContent = "There are no results found for your search.";
      } else {
        document.getElementById("result").textContent = "Found 1 matching product.";
      }
    });
  </script>
</body>
</html>
