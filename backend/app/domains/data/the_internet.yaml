name: the_internet
base_url: https://the-internet.herokuapp.com
workflows:
  - name: login_form
    steps:
      - Navigate to /login
      - Enter valid credentials (tomsmith / SuperSecretPassword!)
      - Submit the login form
    expected_outcome:
      url_contains: /secure
      text_contains: You logged into a secure area

  - name: dropdown
    steps:
      - Navigate to /dropdown
      - Select "Option 2" from the dropdown
    expected_outcome:
      text_contains: Option 2

  - name: dynamic_loading
    steps:
      - Navigate to /dynamic_loading/1
      - Click the Start button
      - Wait for the element to finish loading
    expected_outcome:
      text_contains: Hello World!
