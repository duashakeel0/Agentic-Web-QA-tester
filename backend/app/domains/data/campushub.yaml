# NOTE: base_url is a placeholder (CampusHub's typical local dev address).
# Update it to wherever your CampusHub instance actually runs before
# testing tickets against this domain.
name: campushub
base_url: http://localhost:8000
workflows:
  - name: student_login
    steps:
      - Navigate to /login
      - Enter valid student credentials
      - Submit the login form
    expected_outcome:
      url_contains: /dashboard
      text_contains: Welcome

  - name: mark_attendance
    steps:
      - Log in as an admin or teacher
      - Navigate to the attendance page
      - Mark a student present and submit
    expected_outcome:
      text_contains: Attendance recorded

  - name: view_own_records
    steps:
      - Log in as a student
      - Navigate to attendance records
    expected_outcome:
      text_contains: My Attendance
