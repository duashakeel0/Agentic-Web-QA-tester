[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    e2e: drives a real browser against a local fixture - slower, no network required
# TestPlan/TestRunResult are Pydantic models, not test classes - pytest's
# "Test*" collection heuristic just misfires on the name.
filterwarnings =
    ignore::_pytest.warning_types.PytestCollectionWarning
